<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#0f1c18" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="MyBooks" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>MyBooks</title>
    <script>
      // The chosen look before the first paint, so a Night page never flashes light (src/appearance.ts keeps the rule,
      // and the colours of themeColor() there).
      try {
        var look = localStorage.getItem('mybooks.theme')
        var papers = { night: '#0f1c18', sepia: '#f3e9d2', midnight: '#0e1522', sage: '#eef1e6', bordeaux: '#1c0f13' }
        if (look !== 'paper' && !Object.prototype.hasOwnProperty.call(papers, look)) look = 'night'
        var palette = look === 'midnight' || look === 'bordeaux'
        document.documentElement.dataset.theme = palette ? 'night' : look
        if (palette) document.documentElement.dataset.palette = look
        var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        document.querySelector('meta[name="theme-color"]').setAttribute('content', papers[look] || (dark ? '#16130f' : '#fbf7f0'))
      } catch (e) {
        document.documentElement.dataset.theme = 'night'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Web Pages

# Publishes the whole GitHub Pages site: the docs/ pages at the root (privacy.html and delete-account.html are
# linked from the Play Store listing) and the website under /app/.
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/**'
      - '.github/pages/**'
      - '.github/workflows/web-pages.yml'
  workflow_dispatch:
  # Every night the book news feed is rebuilt and the whole site is published again with it.
  schedule:
    - cron: '15 5 * * *'

permissions:
  pages: write
  id-token: write
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # docs/ holds a .nojekyll file, so the legacy "Deploy from a branch" build never ran Jekyll: it served the
      # files byte for byte (the .md pages as plain text). Copying docs/ as it is reproduces that exactly;
      # actions/jekyll-build-pages would render the .md pages and change those URLs.
      - name: Site root from docs/
        run: |
          mkdir _site
          cp -a docs/. _site/
          test -f _site/.nojekyll
          cp .github/pages/404.html _site/404.html

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Without these the site would build and deploy, but nobody could sign in: stop before publishing it.
      - name: Check the Supabase settings are set
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          missing=""
          [ -n "$VITE_SUPABASE_URL" ] || missing="$missing VITE_SUPABASE_URL"
          [ -n "$VITE_SUPABASE_ANON_KEY" ] || missing="$missing VITE_SUPABASE_ANON_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Repository variable(s) not set:$missing. Set them under Settings > Secrets and variables > Actions > Variables, then run this workflow again. Nothing was deployed."
            exit 1
          fi

      - name: Lint and test the website
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test -- --run

      - name: Build the website into _site/app
        working-directory: web
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          npm run build
          mkdir -p ../_site/app
          cp -a dist/. ../_site/app/

      # news/news.json is rebuilt from public RSS/Atom feeds and merged with the file that is live now, so a bad night
      # never empties it. Both news files are published at /news/, one base URL for the website and the app.
      # When every feed is down and there is no previous file, news.json is published with no items and the step still succeeds.
      - name: Build the book news feed into _site/news
        working-directory: web
        run: |
          mkdir -p ../_site/news
          npx vite-node scripts/news/build-news.ts --out ../_site/news --previous https://marioruidacosta.github.io/MyBooksNewGeneration/news/news.json
          cp public/news/events.json ../_site/news/events.json

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

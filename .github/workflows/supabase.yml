name: Supabase

# Starts a throwaway local Supabase (Docker) and runs the pgTAP tests in supabase/tests
# against the migrations in supabase/migrations, and the lookup Edge Function's Deno tests.
on:
  push:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]

jobs:
  db-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: resolving "latest" fails when GitHub's release API is busy (Service Unavailable).
          version: 3.0.0
      - name: Start local Supabase
        run: bash .github/scripts/annotate.sh supabase start
      - name: Database tests
        run: bash .github/scripts/annotate.sh supabase test db

  lookup-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The lookup Edge Function against recorded BNP and Google Books responses; no network needed.
      - name: Lookup function tests
        run: deno test --allow-read supabase/functions/lookup

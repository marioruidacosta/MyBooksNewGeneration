name: Releases job

# The nightly job that publishes "New in Portugal" runs in the MyBooks repository; this app reads its lists
# (RELEASES_BASE_URL). Here the job's code is only tested when it changes. See docs/releases-setup.md.
on:
  push:
    paths: ["releases/**", ".github/workflows/releases.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Job tests
        run: bash .github/scripts/annotate.sh ./gradlew :releases:test

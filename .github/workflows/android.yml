name: Android

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests and debug APK
        run: bash .github/scripts/annotate.sh ./gradlew :shared:compileCommonMainKotlinMetadata :shared:testAndroidHostTest :androidReader:testDebugUnitTest :androidApp:testDebugUnitTest :androidReader:lintDebug :androidApp:lintDebug :androidApp:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
      - name: Screens (drawn by the screen tests)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: androidApp/build/screenshots/*.png
          if-no-files-found: ignore
      # The Play Store bundle. Signed only on main and when the upload key is in the repository's secrets
      # (RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD); otherwise it is
      # built unsigned, just to check that the release build works.
      - name: Upload key
        id: key
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "file=$RUNNER_TEMP/upload.jks" >> "$GITHUB_OUTPUT"
          fi
      - name: Release bundle
        env:
          RELEASE_STORE_FILE: ${{ steps.key.outputs.file }}
          RELEASE_STORE_PASSWORD: ${{ steps.key.outputs.file && secrets.RELEASE_STORE_PASSWORD || '' }}
          RELEASE_KEY_ALIAS: ${{ steps.key.outputs.file && secrets.RELEASE_KEY_ALIAS || '' }}
          RELEASE_KEY_PASSWORD: ${{ steps.key.outputs.file && secrets.RELEASE_KEY_PASSWORD || '' }}
          # The signed bundle is the app people install: it needs the same keys as the iPhone build.
          GOOGLE_BOOKS_API_KEY: ${{ steps.key.outputs.file && secrets.GOOGLE_BOOKS_API_KEY || '' }}
          SUPABASE_URL: ${{ steps.key.outputs.file && secrets.SUPABASE_URL || '' }}
          SUPABASE_ANON_KEY: ${{ steps.key.outputs.file && secrets.SUPABASE_ANON_KEY || '' }}
        run: ./gradlew :androidApp:bundleRelease
      - name: Keep the signed bundle
        if: steps.key.outputs.file != ''
        uses: actions/upload-artifact@v4
        with:
          name: play-bundle
          path: androidApp/build/outputs/bundle/release/*.aab
      - name: Remove the upload key
        if: always() && steps.key.outputs.file != ''
        run: rm -f "${{ steps.key.outputs.file }}"
